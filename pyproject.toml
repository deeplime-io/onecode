[tool.poetry]
name = "onecode"
version = "2.0.0rc3"
description = "Python skeleton and library for OneCode projects"
readme = "README.md"
authors = ["DeepLime <contact@deeplime.io>"]
license = "MIT"
keywords = ["onecode", "share", "deploy", "cloud"]
homepage = "https://github.com/deeplime-io/onecode"
repository = "https://github.com/deeplime-io/onecode"
documentation = "https://deeplime-io.github.io/onecode"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Code Generators",
]

[tool.poetry.urls]
SBOM = "https://github.com/deeplime-io/onecode/releases/latest"

[tool.poetry.dependencies]
python = ">=3.11, <3.15"
filelock = ">=3.30,<5"
pandas = ">=2.3,<4"
pyarrow = ">=22,<26"
pydash = ">=7,<9"
python-slugify = ">=8,<10"
requirements-parser = ">=0.10.2,<1"

# api
httpx = ">=0.27.2,<1"
rich = ">=14.0.0"
textual = ">=3.0.0"
python-dateutil = ">=2.8.2"
pyperclip = ">=1.9.0"

# cli
inquirerpy = ">=0.3.3,<1"
yaspin = ">=3,<4"

# docs
griffe = { version = ">=2,<3", optional = true }
mike = { version = ">=2,<3", optional = true }
mkdocs = { version = ">=1.6,<2", optional = true }
mkdocs-material = { version = ">=9.7.7,<10", optional = true }
mkdocstrings = { version = ">=1,<2", optional = true }
mkdocstrings-python = { version = ">=2,<3", optional = true }

# developer
datatest = { version = ">=0.11.1,<1", optional = true }
pytest = { version = ">=9.0.3,<10", optional = true }
pytest-cov = { version = ">=6,<8", optional = true }
pytest-xdist = { version = ">=3.6,<4", optional = true }

[tool.poetry.extras]
developer = [
  "datatest",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]

docs = [
  "griffe",
  "mike",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings",
  "mkdocstrings-python",
]

[tool.poetry.scripts]
onecode-start = 'onecode.cli.start:main'
onecode-build = 'onecode.cli.build:main'
onecode-create = 'onecode.cli.create:main'
onecode-add = 'onecode.cli.add:main'
onecode-extract = 'onecode.cli.extract:main'
onecode-zip = 'onecode.cli.zip:main'
onecode-require = 'onecode.cli.require:main'
onecode-check = 'onecode.cli.check:main'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["tests/data", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# pycodestyle 2.15 (current flake8) does not emit E721.
ignore = ["E721"]

[tool.ruff.lint.isort]
known-first-party = ["onecode", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E", "F", "W"]
"onecode/pycg/**" = ["E501"]
"tests/unit/pycg/**" = ["E501"]
